<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지원 - DoCo</title>
    <link rel="alternate" hreflang="en" href="https://noajp.github.io/docoweb/support.html">
    <link rel="alternate" hreflang="ja" href="https://noajp.github.io/docoweb/ja/support.html">
    <link rel="alternate" hreflang="ko" href="https://noajp.github.io/docoweb/ko/support.html">
    <link rel="alternate" hreflang="fr" href="https://noajp.github.io/docoweb/fr/support.html">
    <link rel="alternate" hreflang="es" href="https://noajp.github.io/docoweb/es/support.html">
    <link rel="alternate" hreflang="x-default" href="https://noajp.github.io/docoweb/support.html">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background-color: #000; min-height: 100vh; color: #fff; overflow-x: hidden; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }
      .logo { font-size: 1.8rem; font-weight: 700; color: #fff; text-decoration: none; }
      .header-actions { display: flex; gap: 12px; align-items: center; }
      .lang-switcher { position: relative; display: inline-flex; align-items: center; }
      .lang-switcher select { appearance: none; -webkit-appearance: none; background-color: #1a1a1a; color: #fff; border: 1px solid #2a2a2a; border-radius: 50px; padding: 10px 36px 10px 36px; min-width: 150px; font-size: 0.9rem; font-family: inherit; cursor: pointer; transition: background-color 0.2s; }
      .lang-switcher select:hover { background-color: #2a2a2a; }
      .lang-switcher::before { content: "\1F30F"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 0.85rem; }
      .lang-switcher::after { content: "\25BC"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); pointer-events: none; font-size: 0.65rem; color: #888; }
      .nav-btn { padding: 12px 24px; border-radius: 50px; font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: all 0.2s; }
      .nav-btn-light { background-color: #fff; color: #000; }
      .nav-btn-light:hover { background-color: #f0f0f0; }
      main { padding: 60px 40px; }
      .support-header { text-align: center; margin-bottom: 60px; }
      .support-header h1 { font-size: 3rem; margin-bottom: 20px; background: linear-gradient(135deg, #fff 0%, #999 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .support-header p { font-size: 1.2rem; color: #999; }
      .contact-section { max-width: 600px; margin: 0 auto 80px; background: rgba(255, 255, 255, 0.05); padding: 50px 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; }
      .contact-section h2 { font-size: 1.8rem; margin-bottom: 20px; }
      .contact-section p { font-size: 1.1rem; color: #999; margin-bottom: 30px; }
      .email-link { display: inline-block; padding: 18px 40px; background: #000; color: #fff; text-decoration: none; border-radius: 50px; font-size: 1.2rem; font-weight: 600; transition: all 0.3s; max-width: 100%; word-break: break-all; box-sizing: border-box; border: 1px solid #333; }
      .email-link:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(255, 255, 255, 0.1); background: #1a1a1a; }
      .email-text { margin-top: 20px; font-size: 0.95rem; color: #666; }
      footer { padding: 40px; border-top: 1px solid rgba(255, 255, 255, 0.1); margin-top: 80px; }
      .footer-content { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; }
      .copyright { color: #666; font-size: 0.9rem; }
      .footer-links { display: flex; gap: 30px; flex-wrap: wrap; }
      .footer-links a { color: #999; text-decoration: none; font-size: 0.9rem; transition: color 0.2s; }
      .footer-links a:hover { color: #fff; }
      @media (max-width: 768px) {
        header { padding: 15px 20px; flex-wrap: wrap; gap: 10px; }
        .support-header h1 { font-size: 2rem; }
        .contact-section { padding: 40px 20px; margin: 0 15px 80px; }
        .email-link { padding: 15px 20px; font-size: 0.9rem; width: 100%; max-width: 280px; }
        .footer-content { flex-direction: column; gap: 20px; text-align: center; }
        .footer-links { flex-direction: column; gap: 15px; }
        .lang-switcher select { padding: 8px 30px 8px 32px; font-size: 0.85rem; min-width: 130px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo">DoCo</a>
      <div class="header-actions">
        <div class="lang-switcher">
          <select onchange="if(this.value)window.location.href=this.value" aria-label="언어">
            <option value="" selected disabled>한국어</option>
            <option value="../support.html">English</option>
            <option value="../ja/support.html">日本語</option>
            <option value="support.html">한국어</option>
            <option value="../fr/support.html">Français</option>
            <option value="../es/support.html">Español</option>
          </select>
        </div>
        <a href="#" class="nav-btn nav-btn-light">앱 다운로드</a>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="support-header">
          <h1>지원</h1>
          <p>궁금한 점이 있으신가요? 언제든지 도와드리겠습니다!</p>
        </div>

        <div class="contact-section">
          <h2>문의하기</h2>
          <p>질문, 피드백, 지원 요청은 이메일로 보내주세요.</p>
          <a href="mailto:docoappdirect@gmail.com?subject=DoCo%20Support" class="email-link">docoappdirect@gmail.com</a>
          <p class="email-text">보통 24시간 이내에 답변드립니다.</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="footer-left">
          <span class="copyright">© 2026 DoCo</span>
        </div>
        <div class="footer-links">
          <a href="privacy-policy.html">개인정보 처리방침</a>
          <a href="terms-of-service.html">이용약관</a>
          <a href="community-guidelines.html">커뮤니티 가이드라인</a>
          <a href="content-moderation.html">콘텐츠 정책</a>
          <a href="support.html">지원</a>
        </div>
      </div>
    </footer>
  </body>
</html>
